services:
  web:
    build: .
    image: health-centre:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HEALTH_DB_PATH: /var/lib/health/data/health-centre.sqlite
      COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: "1"
      DEMO_MODE: "true"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the HTTPS public base URL in .env}
    expose: ["3000"]
    volumes:
      - health_data:/var/lib/health
      - ${BACKUP_HOST_DIR:-/opt/health-centre/backups}:/var/lib/health/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  worker:
    image: health-centre:local
    build: .
    command: ["node", "src/workers/run-notification-worker.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DEMO_MODE: "true"
      HEALTH_DB_PATH: /var/lib/health/data/health-centre.sqlite
    volumes:
      - health_data:/var/lib/health
      - ${BACKUP_HOST_DIR:-/opt/health-centre/backups}:/var/lib/health/backups
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const D=require('better-sqlite3');const d=new D(process.env.HEALTH_DB_PATH,{readonly:true});const r=d.prepare('SELECT MAX(last_seen_at) AS t FROM notification_worker_heartbeats').get();d.close();process.exit(r.t&&Date.now()-Date.parse(r.t)<60000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set your DNS hostname in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  health_data:
  caddy_data:
  caddy_config:
