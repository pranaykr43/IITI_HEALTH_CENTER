name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x, 26.x]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run demo
      - name: Check deployment shell scripts
        run: shellcheck -S error deploy/*.sh scripts/*.sh
      - run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  arm64-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 image
        run: docker buildx build --platform linux/arm64 --load -t health-centre:ci .
      - name: Smoke-test ARM64 image
        run: |
          docker run -d --name health-centre-ci --platform linux/arm64 \
            -e PUBLIC_BASE_URL=https://demo.example.test \
            -e TRUST_PROXY_HOPS=1 -e DEMO_MODE=true \
            -e MFA_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            health-centre:ci
          for i in $(seq 1 30); do
            if docker exec health-centre-ci node -e "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then exit 0; fi
            sleep 2
          done
          docker logs health-centre-ci
          exit 1
      - name: Showcase seed runs in the image (demo mode)
        run: |
          docker run --rm --platform linux/arm64             -e NODE_ENV=demo -e HEALTH_DB_PATH=/tmp/showcase.sqlite             -e HEALTH_DEMO_PASSWORD=Ci-Showcase-Password-1             -e MFA_ENCRYPTION_KEY="$(openssl rand -base64 32)"             health-centre:ci node scripts/seed-showcase.js
      - if: always()
        run: docker rm -f health-centre-ci || true
